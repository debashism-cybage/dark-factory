[project]
name = "dark-factory"
version = "1.0.0"
description = "AI-Driven Software Delivery Platform"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "moto>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "boto3-stubs[bedrock-runtime,dynamodb,s3,secretsmanager,stepfunctions]>=1.34.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["shared", "agents", "workflow-starter"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = ["override"]
