name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Build shared layer
        run: |
          mkdir -p shared-layer/python/shared
          cp shared/*.py shared-layer/python/shared/

      - name: SAM Build
        run: sam build --template-file infrastructure/template.yaml

      - name: SAM Deploy
        run: |
          sam deploy \
            --template-file infrastructure/template.yaml \
            --stack-name dark-factory-${{ github.event.inputs.environment || 'dev' }} \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --region ${{ vars.AWS_REGION || 'us-east-1' }} \
            --parameter-overrides \
              Environment=${{ github.event.inputs.environment || 'dev' }} \
              GitHubRepoOwner=${{ github.repository_owner }} \
              GitHubRepoName=${{ github.event.repository.name }} \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
